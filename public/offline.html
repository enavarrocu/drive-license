<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1b2a41" />
  <title>Hors ligne · Permis Trainer</title>
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
  <style>
    :root { --bg: #f4f6fa; --card: #fff; --text: #1b2a41; --muted: #5a6b85; --accent: #1d5bbf; --line: #dde3ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0f1623; --card: #182233; --text: #e6ebf3; --muted: #93a2b8; --accent: #6f9ff0; --line: #2a3850; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; max-width: 420px; width: 100%; text-align: center; }
    img { width: 72px; height: 72px; margin-bottom: 8px; }
    h1 { font-size: 1.25rem; margin: 0 0 6px; }
    p { margin: 0 0 8px; color: var(--muted); line-height: 1.45; }
    button { margin-top: 14px; padding: 10px 18px; border-radius: 10px; border: 1px solid var(--accent); background: var(--accent); color: #fff; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="" />
    <h1 data-fr="Pas de connexion" data-es="Sin conexión">Pas de connexion</h1>
    <p data-fr="Cette page n'est pas disponible hors ligne. Les pages déjà visitées (cours, questions, signaux) restent consultables ; la progression sera enregistrée dès que la connexion reviendra."
       data-es="Esta página no está disponible sin conexión. Las páginas ya visitadas (curso, preguntas, señales) siguen disponibles; el progreso se guardará cuando vuelva la conexión.">Cette page n'est pas disponible hors ligne. Les pages déjà visitées (cours, questions, signaux) restent consultables ; la progression sera enregistrée dès que la connexion reviendra.</p>
    <button type="button" onclick="location.reload()" data-fr="Réessayer" data-es="Reintentar">Réessayer</button>
  </div>
  <script>
    // Idioma de la interfaz: misma cookie `lang` que usa la app (ver useStore).
    (function () {
      var m = /(?:^|;\s*)lang=(fr|es)/.exec(document.cookie)
      var lang = m ? m[1] : 'fr'
      document.documentElement.lang = lang
      document.querySelectorAll('[data-' + lang + ']').forEach(function (el) { el.textContent = el.getAttribute('data-' + lang) })
    })()
  </script>
</body>
</html>
